<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intentional Block</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" class="brand-icon" />
        <span class="brand-name">Intentional Block</span>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button" title="Settings &amp; History">Settings</button>
    </header>

    <div id="apiKeyBanner" class="banner warning" hidden>
      <span>OpenRouter API key not set.</span>
      <button id="setupKeyBtn" class="link-btn" type="button">Configure &rarr;</button>
    </div>

    <section class="section" id="activeGrantsSection" hidden>
      <div class="section-title">Unlocked Now</div>
      <ul id="activeGrantsList" class="grants-list"></ul>
    </section>

    <section class="section" id="currentSiteSection" hidden>
      <div class="section-title">Current Tab</div>
      <div class="current-tab-card">
        <span id="currentHostname" class="hostname"></span>
        <button id="quickBlockBtn" class="primary-btn small" type="button">Block site</button>
      </div>
    </section>

    <section class="section">
      <div class="stats-row">
        <div class="mini-stat">
          <span class="mini-label">Today</span>
          <span id="todayMinutes" class="mini-value">0m</span>
        </div>
        <div class="mini-stat">
          <span class="mini-label">Unlocks</span>
          <span id="todayUnlocks" class="mini-value">0</span>
        </div>
        <div class="mini-stat">
          <span class="mini-label">Blocked Sites</span>
          <span id="blockedCount" class="mini-value">0</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      <button id="viewHistoryBtn" class="secondary-btn full" type="button">View Intention History</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
